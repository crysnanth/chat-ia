<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat CGJ</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="chat-container">
        <!-- Cabeçalho -->
        <header class="chat-header">
            <h1>Chat CGJ</h1>
            <p>Seu parceiro assistente de ideias, respostas e criatividade!</p>


            <!-- Botão de limpar conversa -->
            <div>
                <button id="clear-button" title="Limpar conversa" aria-label="Limpar conversa">
                    🗑️
                    <p1>Limpar Conversa</p1>
                </button>
            </div>
        </header>

        <!-- Área de mensagens -->
        <section
            id="chat-messages"
            class="chat-messages"
            role="log"
            aria-label="Mensagens da conversa"
            aria-live="polite"
            aria-relevant="additions"
        >
            <article class="message message--assistant">
                <p>Olá! Sou o Chat CGJ criado por Crysnanth, Gabriel e Jhonatas. Como posso ajudar você hoje?</p>
            </article>
        </section>

        <!-- Indicador de processamento -->
        <p id="chat-status" role="status" hidden></p>

        <!-- Formulário de envio -->
        <form id="chat-form" class="chat-form">
            <label for="chat-input">
                Sua mensagem
            </label>
            <textarea
                id="chat-input"
                name="message"
                placeholder="Digite sua mensagem..."
                rows="2"
                maxlength="2000"
                required
            ></textarea>
            <button id="send-button" type="submit">
                Enviar
            </button>
        </form>

        <footer class="chat-footer">
            <p><small> &copy; 2026 criado por Crysnanth, Gabriel e Jhonatas</small></p>
        </footer>

    </main>
</body>

</html>
