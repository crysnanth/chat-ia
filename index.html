<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat JCG</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <h1>Chat JCG</h1>
            <p>Seu parceiro assistente de ideias, respostas e criatividade!</p>
            <span class="chat-tag">INTELIGÊNCIA ARTIFICIAL</span>
        </header>
        <section
            id="chat-messages"
            class="chat-messages"
            role="log"
            aria-live="polite"
        >
            <article class="message message--assistant">
                Olá! Sou o Chat JCG. <br>
                Como posso ajudar você hoje?
            </article>
        </section>
        <div id="chat-status"></div>
        <form id="chat-form" class="chat-form">
            <textarea
                id="chat-input"
                placeholder="Digite sua mensagem..."
                required
            ></textarea>
            <div class="chat-form-actions">
                <button
                    id="clear-button"
                    type="button"
                    aria-label="Limpar conversa"
                    data-tooltip="Limpar conversa"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18"></path>
                        <path d="M8 6V4h8v2"></path>
                        <path d="m19 6-1 14H6L5 6"></path>
                        <path d="M10 11v5"></path>
                        <path d="M14 11v5"></path>
                    </svg>
                </button>
                <button id="send-button" type="submit">
                    Enviar
                </button>
            </div>
        </form>
        <footer class="chat-footer">
            © 2026 Desenvolvido por Crysnanth, Gabriel e Jhonatas
        </footer>
    </main>
</body>
</html>
